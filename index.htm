<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>3D Escape to Beach</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 10; }
        button { padding: 20px 40px; font-size: 24px; cursor: pointer; background: #ff4500; color: white; border: none; border-radius: 10px; font-weight: bold; }
        #move-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: none; background: rgba(255,255,255,0.2); border: 2px solid white; }
        #overlay-media { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 20; object-fit: cover; }
    </style>
</head>
<body>

    <div id="ui">
        <button id="start-btn">ПОЧАТИ ГРУ</button>
    </div>

    <button id="move-btn">ЙТИ ВПЕРЕД</button>

    <video id="end-video" class="overlay-media" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:100; background:black;">
        <source src="End.mp4" type="video/mp4">
    </video>
    
    <img id="end-img" src="END.png" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:101; object-fit: contain; background:black; cursor: pointer;">

    <video id="cool-video" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:102; background:black; object-fit: cover;">
        <source src="Cool.mp4" type="video/mp4">
    </video>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        let scene, camera, renderer, moveForward = false;
        let forestGroup, beachGroup, heroes = [];
        let gameStarted = false;
        let progress = 0; 

        const startBtn = document.getElementById('start-btn');
        const moveBtn = document.getElementById('move-btn');
        const endVideo = document.getElementById('end-video');
        const endImg = document.getElementById('end-img');
        const coolVideo = document.getElementById('cool-video');

        startBtn.addEventListener('click', () => {
            document.documentElement.requestFullscreen();
            document.getElementById('ui').style.display = 'none';
            moveBtn.style.display = 'block';
            gameStarted = true;
            init();
        });

        // Логіка для переходу після кліку на фото
        endImg.addEventListener('click', () => {
            endImg.style.display = 'none';
            coolVideo.style.display = 'block';
            coolVideo.play();
        });

        // Перехід на сайт після завершення Cool.mp4
        coolVideo.onended = () => {
            window.location.href = "https://platon-lab.github.io/LAST-CHANCE/";
        };

        moveBtn.addEventListener('mousedown', () => moveForward = true);
        moveBtn.addEventListener('mouseup', () => moveForward = false);
        moveBtn.addEventListener('touchstart', () => moveForward = true);
        moveBtn.addEventListener('touchend', () => moveForward = false);

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x441100, 0.05); 

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const light = new THREE.PointLight(0xff4400, 5, 50);
            camera.add(light);
            scene.add(camera);

            forestGroup = new THREE.Group();
            const treeGeo = new THREE.CylinderGeometry(0.2, 0.4, 5);
            const treeMat = new THREE.MeshBasicMaterial({ color: 0x110500 });
            for(let i=0; i<100; i++) {
                let tree = new THREE.Mesh(treeGeo, treeMat);
                tree.position.set(Math.random()*40-20, 2, -Math.random()*100);
                forestGroup.add(tree);
            }
            scene.add(forestGroup);

            beachGroup = new THREE.Group();
            beachGroup.position.z = -110; 
            
            const sandGeo = new THREE.PlaneGeometry(100, 100);
            const sandMat = new THREE.MeshBasicMaterial({ color: 0xd2b48c });
            const sand = new THREE.Mesh(sandGeo, sandMat);
            sand.rotation.x = -Math.PI/2;
            beachGroup.add(sand);

            const waterGeo = new THREE.PlaneGeometry(100, 50);
            const waterMat = new THREE.MeshBasicMaterial({ color: 0x0077be, transparent: true, opacity: 0.7 });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.rotation.x = -Math.PI/2;
            water.position.set(0, 0.1, -40);
            beachGroup.add(water);

            const heroFiles = ['Junior.png', 'Fil.png', 'Milka.png', 'Bark.png'];
            heroFiles.forEach((file, i) => {
                const loader = new THREE.TextureLoader();
                loader.load(file, (texture) => {
                    const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
                    const geo = new THREE.PlaneGeometry(2, 2);
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set((i * 2.5) - 3.75, 1, -15);
                    beachGroup.add(mesh);
                    heroes.push(mesh);
                });
            });

            scene.add(beachGroup);
            animate();
        }

        function animate() {
            if (!gameStarted) return;
            requestAnimationFrame(animate);

            if (moveForward) {
                camera.position.z -= 0.15;
                camera.position.y = 1.6 + Math.sin(camera.position.z * 5) * 0.05;
            }

            if (camera.position.z < -80) {
                scene.fog.color.setHex(0x87ceeb); 
                scene.fog.density = 0.01;
            }

            if (camera.position.z < -120) {
                triggerEnd();
                gameStarted = false;
            }

            renderer.render(scene, camera);
        }

        function triggerEnd() {
            moveBtn.style.display = 'none';
            endVideo.style.display = 'block';
            endVideo.play();

            endVideo.onended = () => {
                endVideo.style.display = 'none';
                endImg.style.display = 'block';
            };
        }

        window.addEventListener('resize', () => {
            if (camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
